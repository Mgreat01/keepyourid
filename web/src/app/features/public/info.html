<section class="section info-page">
  <div class="eyebrow">KEEPYOURID / {{ page.label }}</div>
  <h1>{{ page.title }}</h1>
  <p class="lead">{{ page.description }}</p>
  <div class="role-grid">
    @for (item of page.items; track item.title) {
      <article class="role-card">
        <h2>{{ item.title }}</h2>
        <p>{{ item.text }}</p>
      </article>
    }
  </div>
  <a class="button" routerLink="/register">Découvrir les possibilités ↗</a>
</section>
